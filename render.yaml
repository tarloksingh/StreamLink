services:
  - type: web
    name: streamlink-signaling
    env: docker
    repo: https://github.com/tarloksingh/StreamLink
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
